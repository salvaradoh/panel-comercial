# Publica el panel en GitHub Pages en cada push a main.
#
# Reemplaza al deploy-pages.sh que se corría a mano desde la máquina de Samuel:
# hace lo mismo —build con VITE_BASE_URL y push forzado a gh-pages— pero lo
# dispara el commit, así que quien edita el diseño ve su cambio publicado sin
# pedirle a nadie que lo suba.
name: Publicar el panel

on:
  push:
    branches: [main]
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write           # lo necesita para empujar a la rama gh-pages

concurrency:
  group: publicar
  cancel-in-progress: true  # si llegan dos commits seguidos, publica el último

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      # --legacy-peer-deps NO es opcional: react-simple-maps declara peer React
      # 18 y el proyecto está en React 19. Sin esto falla con ERESOLVE.
      - run: npm ci --legacy-peer-deps

      # `npm run build` corre `tsc -b && vite build`, así que un error de tipos
      # frena la publicación. Es a propósito: es la única verificación real que
      # tiene este repo.
      - run: npm run build
        env:
          VITE_BASE_URL: /panel-comercial/

      - name: Publicar a gh-pages
        run: |
          # 404.html = index.html para que Pages sirva las rutas del SPA.
          cp dist/index.html dist/404.html
          cd dist
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
